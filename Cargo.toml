[package]
name = "ouma"
version = "0.0.0"
edition = "2024"
rust-version = "1.100.0"

[lib]
name = "c"
crate-type = ["staticlib", "cdylib"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[features]
default = []
use_futex_lock = []

[dependencies]
allocator-api2 = { version = "0.4.0", default-features = false, features = ["alloc"] }
atomic_refcell = "0.1"
bnum = { version = "0.14", default-features = false, features = ["numtraits"] }
bstr = { version = "1.12", default-features = false }
icu_calendar = "2.3"
icu_casemap = { version = "2.3", default-features = false, features = ["compiled_data"] }
icu_collator = { version = "2.3", default-features = false, features = ["compiled_data"] }
icu_datetime = { version = "2.3", default-features = false, features = ["compiled_data"] }
icu_decimal = { version = "2.3", default-features = false, features = ["compiled_data"] }
icu_experimental = { version = "0.6", default-features = false, features = ["compiled_data"] }
icu_locale = { version = "2.3", default-features = false, features = ["compiled_data"] }
icu_properties = { version = "2.3", default-features = false, features = ["compiled_data"] }
icu_provider = { version = "2.3", default-features = false, features = ["logging"] }
icu_time = "2.3"
libm = "0.2"
lock_api = "0.4"
num-traits = { version = "0.2", default-features = false, features = ["i128"] }
rbitset = "1.0.0"
scudo = "0.1.3"
smallvec = { version = "1.15", default-features = false, features = ["const_new", "const_generics"] }
strum = { version = "0.28", default-features = false, features = ["derive"] }
strum_macros = "0.28"
